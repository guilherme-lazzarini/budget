<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejamento Financeiro</title>
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteca Chart.js para os gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Cabeçalho -->
        <header class="header">
            <button class="btn-chart" id="toggle-btn" onclick="toggleView()">📊 Gráfico</button>
            <div class="month-selector">
                <strong>Budget</strong>
            </div>
            <span class="icon">🐷</span>
        </header>

        <!-- Painel de Saldo Líquido -->
        <div class="balance-section">
            <div class="balance-label">Saldo Restante</div>
            <h2 class="balance-value" id="net-balance">R$0.00</h2>
        </div>

        <!-- VISÃO 1: LISTA DE CATEGORIAS -->
        <div id="view-categories">
            <div class="section-title">Expense <span id="total-expense">R$0.00</span> ▾</div>
            <div class="grid" id="expense-grid"></div>

            <div class="section-title">Income <span id="total-income">R$0.00</span> ▾</div>
            <div class="grid" id="income-grid"></div>
        </div>

        <!-- VISÃO 2: GRÁFICO DE DESPESAS -->
        <div id="view-chart" class="hidden">
            <div class="section-title">Análise de Despesas</div>
            <div class="chart-main-container">
                <canvas id="budgetChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Modal para gerenciar contas da categoria -->
    <div class="modal" id="transaction-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Nome da Categoria</h3>
                <div class="header-actions">
                    <button class="btn-add-icon" onclick="toggleAddForm()" title="Adicionar Nova Conta">+</button>
                    <button class="btn-close" onclick="closeModal()">×</button>
                </div>
            </div>
            
            <div class="account-list" id="account-list"></div>

            <div class="add-account-form hidden" id="add-form">
                <h4>Adicionar nova conta</h4>
                <input type="text" id="transaction-desc" placeholder="Nome da conta (Ex: Mercado)">
                <input type="text" inputmode="decimal" id="transaction-amount" placeholder="Valor (Ex: 150.50)">
                <button class="btn btn-save" onclick="saveTransaction()">Adicionar</button>
            </div>
        </div>
    </div>

    <!-- Script de Integração com Firebase e Lógica da Aplicação -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
        import { getDatabase, ref, get, set, child } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC6yemAvkDq0auJBUGSDoJ3PP2s7Nt4WVE",
            authDomain: "bucket-314159.firebaseapp.com",
            databaseURL: "https://bucket-314159-default-rtdb.firebaseio.com/",
            projectId: "bucket-314159",
            storageBucket: "bucket-314159.firebasestorage.app",
            messagingSenderId: "725579120022",
            appId: "1:725579120022:web:3d852b76e54633d4a231b7",
            measurementId: "G-TWGCBJJ3EY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const userPath = "budgets/usuario_padrao";

        const categories = [
            { id: 'monthly_bills', name: 'Monthly Bills', type: 'expense', color: '#FBE9E7', icon: '📅', border: '#ffc1b5' },
            { id: 'food', name: 'Food', type: 'expense', color: '#FFF3E0', icon: '🍽️', border: '#ffcca6' },
            { id: 'transport', name: 'Transport', type: 'expense', color: '#E3F2FD', icon: '🚌', border: '#a3d1ff' },
            { id: 'health', name: 'Health', type: 'expense', color: '#E0F2F1', icon: '🏥', border: '#99d9d4' },
            { id: 'lifestyle', name: 'Lifestyle', type: 'expense', color: '#F3E5F5', icon: '🍹', border: '#d9b3e6' },
            { id: 'financial', name: 'Financial', type: 'expense', color: '#FFEBEE', icon: '🏦', border: '#ffb3bd' },
            
            { id: 'salary', name: 'Salary', type: 'income', color: '#E0F2F1', icon: '💳' },
            { id: 'freelance', name: 'Freelance', type: 'income', color: '#F1F8E9', icon: '💎' },
            { id: 'investment_inc', name: 'Investment', type: 'income', color: '#F9FBE7', icon: '🪙' }
        ];

        let currentCategoryId = null;
        let myChart = null;
        let isShowingChart = false;
        let budgetData = {};

        async function initDB() {
            const dbRef = ref(db);
            const snapshot = await get(child(dbRef, userPath));

            if (snapshot.exists()) {
                budgetData = snapshot.val();
                // Garante que todas as categorias existam no objeto vindo do banco
                categories.forEach(cat => {
                    if (!budgetData[cat.id]) budgetData[cat.id] = [];
                });
            } else {
                budgetData = {};
                categories.forEach(cat => budgetData[cat.id] = []);
                await set(ref(db, userPath), budgetData);
            }
            render();
        }

        async function saveDB() {
            await set(ref(db, userPath), budgetData);
        }

        function getCategoryTotal(accountsArray) {
            if (!Array.isArray(accountsArray)) return 0;
            return accountsArray.reduce((acc, curr) => acc + Number(curr.amount || 0), 0);
        }

        window.toggleView = function() {
            isShowingChart = !isShowingChart;
            const btn = document.getElementById('toggle-btn');
            const viewCategories = document.getElementById('view-categories');
            const viewChart = document.getElementById('view-chart');

            if (isShowingChart) {
                viewCategories.classList.add('hidden');
                viewChart.classList.remove('hidden');
                btn.innerHTML = '🗂️ Categorias';
                renderChart();
            } else {
                viewChart.classList.add('hidden');
                viewCategories.classList.remove('hidden');
                btn.innerHTML = '📊 Gráfico';
            }
        }

        function render() {
            const expenseGrid = document.getElementById('expense-grid');
            const incomeGrid = document.getElementById('income-grid');
            
            expenseGrid.innerHTML = '';
            incomeGrid.innerHTML = '';
            
            let totalExpense = 0;
            let totalIncome = 0;

            categories.forEach(cat => {
                const accounts = budgetData[cat.id] || [];
                const categorySum = getCategoryTotal(accounts);
                if (cat.type === 'expense') totalExpense += categorySum;
                if (cat.type === 'income') totalIncome += categorySum;
            });

            categories.forEach(cat => {
                const accounts = budgetData[cat.id] || [];
                const categorySum = getCategoryTotal(accounts);
                
                let percentageHtml = '';
                if (categorySum > 0) {
                    let pct = 0;
                    if (cat.type === 'expense' && totalExpense > 0) {
                        pct = (categorySum / totalExpense) * 100;
                    } else if (cat.type === 'income' && totalIncome > 0) {
                        pct = (categorySum / totalIncome) * 100;
                    }
                    percentageHtml = `<div class="card-percentage">${pct.toFixed(1)}%</div>`;
                }

                const cardHtml = `
                    <div class="card" style="background-color: ${cat.color}" onclick="openModal('${cat.id}', '${cat.name}')">
                        <div class="card-title">${cat.name}</div>
                        <div class="card-icon">${cat.icon}</div>
                        <div class="card-value">R$${categorySum.toFixed(2)}</div>
                        ${percentageHtml}
                    </div>
                `;

                if (cat.type === 'expense') {
                    expenseGrid.innerHTML += cardHtml;
                } else {
                    incomeGrid.innerHTML += cardHtml;
                }
            });

            document.getElementById('total-expense').innerText = `R$${totalExpense.toFixed(2)}`;
            document.getElementById('total-income').innerText = `R$${totalIncome.toFixed(2)}`;

            const netBalance = totalIncome - totalExpense;
            const balanceEl = document.getElementById('net-balance');
            balanceEl.innerText = `R$${netBalance.toFixed(2)}`;
            
            if (netBalance >= 0) {
                balanceEl.className = 'balance-value balance-positive';
            } else {
                balanceEl.className = 'balance-value balance-negative';
            }

            if (isShowingChart) renderChart();
        }

        function renderChart() {
            const labels = [];
            const chartValues = [];
            const bgColors = [];
            const borderColors = [];

            let totalExpenseSum = 0;
            categories.forEach(cat => {
                if (cat.type === 'expense') {
                    totalExpenseSum += getCategoryTotal(budgetData[cat.id] || []);
                }
            });

            categories.forEach(cat => {
                if (cat.type === 'expense') {
                    const total = getCategoryTotal(budgetData[cat.id] || []);
                    if (total > 0) {
                        let percentage = totalExpenseSum > 0 ? ((total / totalExpenseSum) * 100).toFixed(1) : 0;
                        labels.push(`${cat.name} (${percentage}%)`);
                        chartValues.push(total);
                        bgColors.push(cat.color);
                        borderColors.push(cat.border);
                    }
                }
            });

            const ctx = document.getElementById('budgetChart').getContext('2d');
            
            if (myChart) {
                myChart.destroy();
            }

            if (chartValues.length === 0) {
                labels.push('Sem Despesas (0%)');
                chartValues.push(1);
                bgColors.push('#f0f0f0');
                borderColors.push('#e0e0e0');
            }

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: chartValues,
                        backgroundColor: bgColors,
                        borderColor: borderColors,
                        borderWidth: 2,
                        hoverOffset: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                font: { family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto', size: 13 }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let value = context.raw;
                                    let total = context.chart._metasets[context.datasetIndex].total;
                                    let percentage = total > 0 ? ((value / total) * 100).toFixed(1) + '%' : '0%';
                                    
                                    if (context.label.includes('Sem Despesas')) return ' R$0.00';
                                    return ` R$${value.toFixed(2)} (${percentage})`;
                                }
                            }
                        }
                    },
                    cutout: '65%'
                }
            });
        }

        window.openModal = function(categoryId, categoryName) {
            currentCategoryId = categoryId;
            document.getElementById('modal-title').innerText = categoryName;
            document.getElementById('transaction-desc').value = '';
            document.getElementById('transaction-amount').value = '';
            document.getElementById('add-form').classList.add('hidden');
            renderModalList();
            document.getElementById('transaction-modal').classList.add('active');
        }

        window.closeModal = function() {
            document.getElementById('transaction-modal').classList.remove('active');
            currentCategoryId = null;
        }

        window.toggleAddForm = function() {
            document.getElementById('add-form').classList.toggle('hidden');
        }

        function renderModalList() {
            const accounts = budgetData[currentCategoryId] || [];
            const listContainer = document.getElementById('account-list');
            
            listContainer.innerHTML = '';
            
            if (accounts.length === 0) {
                listContainer.innerHTML = '<p style="color: #888; font-size: 0.9rem;">Nenhuma conta adicionada.</p>';
                return;
            }

            accounts.forEach((acc, index) => {
                listContainer.innerHTML += `
                    <div class="account-item">
                        <div class="account-info">
                            <span>${acc.desc}</span>
                            <strong>R$${Number(acc.amount || 0).toFixed(2)}</strong>
                        </div>
                        <button class="btn-delete" onclick="deleteTransaction(${index})" title="Remover">🗑️</button>
                    </div>
                `;
            });
        }

        window.saveTransaction = async function() {
            const descInput = document.getElementById('transaction-desc').value.trim();
            const rawAmount = document.getElementById('transaction-amount').value.trim().replace(',', '.');
            const amountInput = parseFloat(rawAmount);
            
            if (!descInput) {
                alert("Por favor, insira o nome da conta.");
                return;
            }
            if (isNaN(amountInput) || amountInput <= 0) {
                alert("Por favor, insira um valor válido.");
                return;
            }

            // Assegura que o array da categoria existe antes de fazer o push
            if (!budgetData[currentCategoryId] || !Array.isArray(budgetData[currentCategoryId])) {
                budgetData[currentCategoryId] = [];
            }

            budgetData[currentCategoryId].push({
                desc: descInput,
                amount: amountInput
            });
            
            await saveDB();
            closeModal();
            render();
        }

        window.deleteTransaction = async function(index) {
            if (budgetData[currentCategoryId] && budgetData[currentCategoryId].length > index) {
                budgetData[currentCategoryId].splice(index, 1);
                await saveDB();
                renderModalList();
                render();
            }
        }

        initDB();
    </script>
</body>
</html>
